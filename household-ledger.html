<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>우리 왕국의 곳간</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="왕국의 곳간">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-ledger.png">
<style>
  :root{
    --bg:#0B0906;
    --wood:#2A2018;
    --wood-light:#3B2E22;
    --gold:#D4AF56;
    --gold-dim:#8A733A;
    --gold-bright:#F0D080;
    --parchment:#E8DCC0;
    --parchment-dim:#B3A585;
    --income:#6FBF73;
    --income-bright:#8FDB93;
    --expense:#C1443B;
    --expense-bright:#E0685E;
    --rose:#D3708F;
    --rose-bright:#F0A0B8;
    --mp:#2E5F8B;
    --mp-bright:#4A8FC1;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(ellipse at top, #1a140d 0%, #0B0906 60%);
    color:var(--parchment);
    font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    min-height:100vh;
    padding:10px 8px 60px;
    position:relative;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,0.18) 0px, rgba(0,0,0,0.18) 1px, transparent 1px, transparent 3px);
    opacity:0.35; z-index:5;
  }
  .wrap{max-width:480px;margin:0 auto;}

  .frame{
    background:linear-gradient(180deg, var(--wood-light), var(--wood));
    border:3px solid var(--gold-dim);
    border-radius:2px;
    position:relative;
    padding:12px;
    margin-bottom:12px;
    box-shadow:inset -3px -3px 0 rgba(0,0,0,0.55), inset 3px 3px 0 rgba(255,255,255,0.10), 0 3px 10px rgba(0,0,0,0.6);
  }
  .frame::before,.frame::after,.frame .c1,.frame .c2,.frame .c3,.frame .c4{
    content:"";position:absolute;width:12px;height:12px;border:3px solid var(--gold-bright);
  }
  .c1{top:-2px;left:-2px;border-right:none;border-bottom:none;}
  .c2{top:-2px;right:-2px;border-left:none;border-bottom:none;}
  .c3{bottom:-2px;left:-2px;border-right:none;border-top:none;}
  .c4{bottom:-2px;right:-2px;border-left:none;border-top:none;}
  .frame-title{
    font-family:Georgia,"Noto Serif KR",serif;font-size:12px;letter-spacing:2px;color:var(--gold-bright);
    text-align:center;margin:-12px -12px 10px;padding:6px;
    background:linear-gradient(180deg, rgba(0,0,0,0.35), transparent);
    border-bottom:1px solid var(--gold-dim);
  }

  .game-title{text-align:center;margin-bottom:10px;padding:8px 0 4px;}
  .game-title .sub{font-size:10px;letter-spacing:3px;color:var(--gold-dim);}
  .game-title h1{
    font-family:Georgia,"Noto Serif KR",serif;font-size:20px;color:var(--gold-bright);
    margin:2px 0 0;text-shadow:0 0 12px rgba(212,175,86,0.4);letter-spacing:1px;
  }

  /* Party cards */
  .party-row{display:flex;gap:8px;}
  .party-card{
    flex:1;background:#0E0C0A;border:2px solid var(--gold-dim);border-radius:5px;
    padding:9px;text-align:center;
  }
  .party-card.active{border-color:var(--gold);}
  .party-icon{font-size:26px;}
  .party-name{font-size:11.5px;font-weight:700;margin-top:3px;}
  .party-stat{font-family:'SF Mono','Consolas',monospace;font-size:9.5px;color:var(--parchment-dim);margin-top:2px;}

  /* Treasury */
  .treasury-row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:7px;}
  .treasury-row .v{font-family:'SF Mono','Consolas',monospace;}
  .v.income{color:var(--income-bright);}
  .v.expense{color:var(--expense-bright);}
  .v.net{color:var(--gold-bright);font-weight:700;}
  .goal-bar-outer{
    height:15px;background:#0E0C0A;border:2px solid rgba(0,0,0,0.7);border-radius:1px;overflow:hidden;
    box-shadow:inset -1px -1px 0 rgba(255,255,255,0.06), inset 1px 1px 0 rgba(0,0,0,0.5);
  }
  .goal-bar-inner{height:100%;background:linear-gradient(180deg, var(--gold-bright), var(--gold-dim));position:relative;}
  .goal-bar-inner::after{
    content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(90deg, transparent 0px, transparent 7px, rgba(0,0,0,0.4) 7px, rgba(0,0,0,0.4) 9px);
  }
  .goal-pct{text-align:center;font-family:'SF Mono','Consolas',monospace;font-size:10px;color:var(--parchment-dim);margin-top:4px;}
  .goal-bar-inner.short{background:linear-gradient(180deg, var(--rose-bright), var(--rose));}
  .goal-bar-inner.budget.ok{background:linear-gradient(180deg, var(--income-bright), var(--income));}
  .goal-bar-inner.budget.over{background:linear-gradient(180deg, var(--expense-bright), var(--expense));}
  .gear-btn{
    background:transparent;border:1px solid var(--gold-dim);color:var(--parchment-dim);
    font-size:10px;padding:3px 8px;border-radius:10px;cursor:pointer;
  }

  /* Contribution stat */
  .contrib{
    font-family:'SF Mono','Consolas',monospace;font-size:9.5px;margin-top:2px;
  }
  .contrib.pos{color:var(--income-bright);}

  /* Action buttons */
  .action-row{display:flex;gap:8px;margin-top:10px;}
  .action-btn{
    flex:1;border:none;padding:11px 4px;border-radius:4px;font-size:13px;font-weight:700;cursor:pointer;
    font-family:Georgia,"Noto Serif KR",serif;letter-spacing:0.5px;
  }
  .action-btn.income{background:linear-gradient(180deg, var(--income-bright), var(--income)); color:#0B0906;}
  .action-btn.expense{background:linear-gradient(180deg, var(--expense-bright), var(--expense)); color:#fff;}

  /* Monthly report */
  .cat-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dotted rgba(212,175,86,0.15);}
  .cat-row:last-child{border-bottom:none;}
  .cat-icon{font-size:16px;width:22px;text-align:center;}
  .cat-name{width:64px;font-size:11.5px;}
  .cat-bar-outer{flex:1;height:8px;background:#0E0C0A;border:1px solid rgba(193,68,59,0.3);border-radius:2px;overflow:hidden;}
  .cat-bar-inner{height:100%;background:var(--expense);}
  .cat-amt{font-family:'SF Mono','Consolas',monospace;font-size:10.5px;color:var(--parchment-dim);width:66px;text-align:right;}

  /* Log */
  .syslog{
    background:rgba(0,0,0,0.45);border:1px solid var(--gold-dim);border-radius:4px;padding:8px 10px;
    max-height:220px;overflow-y:auto;font-family:'SF Mono','Consolas',monospace;font-size:10.5px;line-height:1.8;
  }
  .syslog .entry{color:var(--parchment-dim);}
  .syslog .entry.income .tag{color:var(--income-bright);}
  .syslog .entry.expense .tag{color:var(--expense-bright);}

  .refresh-btn{
    display:block;margin:12px auto 0;background:transparent;border:1px solid var(--parchment-dim);
    color:var(--parchment-dim);font-size:10.5px;padding:7px 14px;border-radius:3px;cursor:pointer;
  }
  .switch-btn{
    display:block;margin:8px auto 0;background:transparent;border:none;
    color:var(--gold-dim);font-size:10px;text-decoration:underline;cursor:pointer;
  }

  /* Modal (expense entry) */
  #modalOverlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:flex-end;justify-content:center;
    z-index:1200;opacity:0;pointer-events:none;transition:opacity .25s ease;padding:0 8px 8px;
  }
  #modalOverlay.show{opacity:1;pointer-events:auto;}
  .modal-box{
    width:100%;max-width:460px;background:linear-gradient(180deg, #3B2E22, #1c150d);
    border:2px solid var(--gold);border-radius:6px;padding:14px;box-shadow:0 -6px 24px rgba(0,0,0,0.7);
  }
  .modal-title{font-family:Georgia,"Noto Serif KR",serif;font-size:14px;color:var(--gold-bright);margin-bottom:10px;text-align:center;}
  .modal-input{
    width:100%;background:#0E0C0A;border:1px solid var(--gold-dim);border-radius:3px;color:var(--parchment);
    font-size:15px;padding:9px 10px;margin-bottom:10px;font-family:'SF Mono','Consolas',monospace;
  }
  .modal-input::placeholder{color:var(--parchment-dim);}
  .cat-grid{display:grid;grid-template-columns:repeat(4, 1fr);gap:6px;margin-bottom:10px;}
  .cat-btn{
    background:#0E0C0A;border:1px solid var(--gold-dim);border-radius:4px;color:var(--parchment-dim);
    padding:8px 2px;text-align:center;font-size:10px;cursor:pointer;
  }
  .cat-btn.selected{background:rgba(212,175,86,0.15);border-color:var(--gold);color:var(--gold-bright);}
  .cat-btn .ic{font-size:17px;display:block;margin-bottom:2px;}
  .modal-btns{display:flex;gap:8px;}
  .modal-btn{
    flex:1;border:none;padding:10px;border-radius:3px;font-weight:700;font-size:12.5px;cursor:pointer;
    font-family:Georgia,"Noto Serif KR",serif;
  }
  .modal-btn.submit{background:linear-gradient(180deg, var(--gold), var(--gold-dim));color:#1a140d;}
  .modal-btn.cancel{background:transparent;border:1px solid var(--parchment-dim);color:var(--parchment-dim);}

  /* Person picker */
  #personOverlay{
    position:fixed;inset:0;background:#0B0906;display:flex;flex-direction:column;align-items:center;justify-content:center;
    z-index:1300;gap:18px;padding:20px;
  }
  #personOverlay h2{font-family:Georgia,"Noto Serif KR",serif;color:var(--gold-bright);font-size:17px;text-align:center;}
  .person-choice{
    display:flex;gap:16px;
  }
  .person-opt{
    background:var(--wood);border:2px solid var(--gold-dim);border-radius:6px;padding:20px 24px;text-align:center;cursor:pointer;
  }
  .person-opt .ic{font-size:40px;display:block;margin-bottom:8px;}
  .person-opt span{font-size:12.5px;color:var(--parchment);}

  #settingsOverlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:flex-end;justify-content:center;
    z-index:1200;opacity:0;pointer-events:none;transition:opacity .25s ease;padding:0 8px 8px;
  }
  #settingsOverlay.show{opacity:1;pointer-events:auto;}
  .s-label{font-size:10.5px;color:var(--parchment-dim);display:block;margin-bottom:4px;margin-top:2px;}

  .toast{
    position:fixed;top:14px;left:50%;transform:translate(-50%,-10px);
    background:linear-gradient(180deg, #3B2E22, #1c150d);border:1px solid var(--gold);color:var(--gold-bright);
    font-size:12px;padding:8px 16px;border-radius:4px;box-shadow:0 4px 14px rgba(0,0,0,0.6);
    opacity:0;transition:opacity .3s ease, transform .3s ease;z-index:1400;text-align:center;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  .loading{text-align:center;color:var(--parchment-dim);font-size:12px;padding:20px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="game-title">
    <div class="sub">O U R &nbsp; K I N G D O M</div>
    <h1>우리 왕국의 곳간</h1>
  </div>

  <div class="frame">
    <div class="c1"></div><div class="c2"></div><div class="c3"></div><div class="c4"></div>
    <div class="frame-title">파 티 원</div>
    <div class="party-row" id="partyRow"></div>
  </div>

  <div class="frame">
    <div class="c1"></div><div class="c2"></div><div class="c3"></div><div class="c4"></div>
    <div class="frame-title">곳 간 현 황</div>
    <div class="treasury-row"><span>이번 달 수입</span><span class="v income" id="mIncome">0원</span></div>
    <div class="treasury-row"><span>이번 달 지출</span><span class="v expense" id="mExpense">0원</span></div>
    <div class="treasury-row"><span>이번 달 순이익</span><span class="v net" id="mNet">0원</span></div>

    <div style="margin-top:10px; font-size:11px; color:var(--parchment-dim); display:flex; justify-content:space-between; align-items:center;">
      <span id="longGoalLabel">🏰 장기 목표</span>
      <button class="gear-btn" id="settingsBtn">⚙️ 목표 설정</button>
    </div>
    <div class="goal-bar-outer" style="margin-top:4px;"><div class="goal-bar-inner" id="goalBar" style="width:0%"></div></div>
    <div class="goal-pct" id="goalPct">0.00%</div>

    <div style="margin-top:10px; font-size:11px; color:var(--parchment-dim);" id="shortGoalLabel">🌱 현실 목표</div>
    <div class="goal-bar-outer short" style="margin-top:4px;"><div class="goal-bar-inner short" id="shortGoalBar" style="width:0%"></div></div>
    <div class="goal-pct" id="shortGoalPct">0.00%</div>

    <div style="margin-top:10px; font-size:11px; color:var(--parchment-dim);">이번 달 예산 관리</div>
    <div class="goal-bar-outer budget" style="margin-top:4px;"><div class="goal-bar-inner budget" id="budgetBar" style="width:0%"></div></div>
    <div class="goal-pct" id="budgetPct">예산 미설정</div>

    <div class="action-row">
      <button class="action-btn income" id="incomeBtn">+ 수입 기록</button>
      <button class="action-btn expense" id="expenseBtn">- 지출 기록</button>
    </div>
  </div>

  <div class="frame">
    <div class="c1"></div><div class="c2"></div><div class="c3"></div><div class="c4"></div>
    <div class="frame-title">이 달의 지출 지도</div>
    <div id="catReport"><div class="loading">기록이 없습니다</div></div>
  </div>

  <div class="frame">
    <div class="c1"></div><div class="c2"></div><div class="c3"></div><div class="c4"></div>
    <div class="frame-title">모 험 기 록</div>
    <div class="syslog" id="syslog"><div class="loading">불러오는 중...</div></div>
  </div>

  <button class="refresh-btn" id="refreshBtn">🔄 새로고침</button>
  <button class="switch-btn" id="switchBtn">다른 캐릭터로 전환</button>

</div>

<div id="modalOverlay">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle">지출 기록</div>
    <input type="date" class="modal-input" id="modalDate">
    <input type="number" inputmode="numeric" class="modal-input" id="modalAmount" placeholder="금액 (원)">
    <div class="cat-grid" id="catGrid"></div>
    <input type="text" class="modal-input" id="modalMemo" placeholder="메모 (선택)">
    <div class="modal-btns">
      <button class="modal-btn cancel" id="modalCancel">취소</button>
      <button class="modal-btn submit" id="modalSubmit">기록하기</button>
    </div>
  </div>
</div>

<div id="settingsOverlay">
  <div class="modal-box">
    <div class="modal-title">우리 가족의 목표 설정</div>
    <label class="s-label">🏰 장기 목표 이름</label>
    <input type="text" class="modal-input" id="setLongLabel" placeholder="예: 우리의 최종 목표">
    <label class="s-label">🏰 장기 목표 금액 (원)</label>
    <input type="number" inputmode="numeric" class="modal-input" id="setLongGoal" placeholder="예: 3000000000">
    <label class="s-label">🌱 현실 목표 이름</label>
    <input type="text" class="modal-input" id="setShortLabel" placeholder="예: 올해 저축 목표">
    <label class="s-label">🌱 현실 목표 금액 (원)</label>
    <input type="number" inputmode="numeric" class="modal-input" id="setShortGoal" placeholder="예: 10000000">
    <label class="s-label">📅 이번 달 지출 예산 (원)</label>
    <input type="number" inputmode="numeric" class="modal-input" id="setBudget" placeholder="예: 2000000">
    <div class="modal-btns">
      <button class="modal-btn cancel" id="settingsCancel">취소</button>
      <button class="modal-btn submit" id="settingsSubmit">저장하기</button>
    </div>
  </div>
</div>

<div id="personOverlay">
  <h2>당신은 누구인가요?<br>(이 폰에서는 계속 이 캐릭터로 기록됩니다)</h2>
  <div class="person-choice">
    <div class="person-opt" data-person="yoo"><span class="ic">🧙</span><span>법사 유대승</span></div>
    <div class="person-opt" data-person="wife"><span class="ic">👸</span><span>공주님</span></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const DB_URL = "https://yooco-f7785-default-rtdb.firebaseio.com";
const CATEGORIES = [
  {id:"food", name:"식비", icon:"🍚"},
  {id:"transport", name:"교통", icon:"🚗"},
  {id:"medical", name:"의료", icon:"🏥"},
  {id:"housing", name:"주거/공과금", icon:"🏠"},
  {id:"education", name:"교육", icon:"📚"},
  {id:"childcare", name:"육아", icon:"👶"},
  {id:"telecom", name:"통신", icon:"📱"},
  {id:"etc", name:"기타", icon:"📦"},
];
const PERSON_INFO = {
  yoo: {name:"법사 유대승", icon:"🧙"},
  wife: {name:"공주님", icon:"👸"},
};

let myPerson = localStorage.getItem("ledger_person");
let entries = [];
let selectedCat = null;
let modalMode = "expense";
let settings = {
  longLabel: "장기 목표",
  longGoal: 3000000000,
  shortLabel: "현실 목표",
  shortGoal: 10000000,
  monthlyBudget: 0
};

function todayStr(){
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

function fmt(n){ return (n||0).toLocaleString('ko-KR')+"원"; }

function showToast(text){
  const t = document.getElementById("toast");
  t.textContent = text;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2000);
}

async function loadSettings(){
  try{
    const res = await fetch(`${DB_URL}/ledger/settings.json`);
    const data = await res.json();
    if(data){
      settings = { ...settings, ...data };
    }
  }catch(e){
    console.error("설정 불러오기 실패", e);
  }
}

async function saveSettings(newSettings){
  settings = newSettings;
  try{
    await fetch(`${DB_URL}/ledger/settings.json`, {
      method:"PUT",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify(settings)
    });
  }catch(e){
    console.error("설정 저장 실패", e);
    showToast("⚠️ 설정 저장에 실패했어요");
  }
}

async function loadEntries(){
  document.getElementById("syslog").innerHTML = '<div class="loading">불러오는 중...</div>';
  try{
    const res = await fetch(`${DB_URL}/ledger/entries.json`);
    const data = await res.json();
    entries = [];
    if(data){
      for(const key in data){
        entries.push({id:key, ...data[key]});
      }
    }
    entries.sort((a,b)=> (b.ts||0) - (a.ts||0));
  }catch(e){
    console.error("불러오기 실패", e);
    showToast("⚠️ 곳간 데이터를 불러오지 못했어요");
  }
  renderAll();
}

async function pushEntry(entry){
  try{
    await fetch(`${DB_URL}/ledger/entries.json`, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify(entry)
    });
  }catch(e){
    console.error("기록 실패", e);
    showToast("⚠️ 기록에 실패했어요, 다시 시도해주세요");
    throw e;
  }
}

function isThisMonth(ts){
  const d = new Date(ts);
  const now = new Date();
  return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
}

function renderParty(){
  const box = document.getElementById("partyRow");
  box.innerHTML = Object.keys(PERSON_INFO).map(pid=>{
    const info = PERSON_INFO[pid];
    const mine = entries.filter(e=>e.person===pid);
    const thisMonthMine = mine.filter(e=>isThisMonth(e.ts));
    const count = thisMonthMine.length;
    const active = pid === myPerson;

    // 기여 포인트: 본인이 기록한 수입 금액 + 지출 관리(건당 1,000P, 실제 돈이 아니라 "가계부를 성실히 관리한 기여")
    const incomeContrib = thisMonthMine.filter(e=>e.type==='income').reduce((s,e)=>s+e.amount,0);
    const manageCount = thisMonthMine.filter(e=>e.type==='expense').length;
    const manageContrib = manageCount * 1000;
    const totalContrib = incomeContrib + manageContrib;

    return `
      <div class="party-card ${active?'active':''}">
        <div class="party-icon">${info.icon}</div>
        <div class="party-name">${info.name}${active?' (나)':''}</div>
        <div class="party-stat">이번달 ${count}건 기록</div>
        <div class="contrib pos">기여 +${totalContrib.toLocaleString('ko-KR')}P</div>
      </div>`;
  }).join("");
}

function renderTreasury(){
  const monthEntries = entries.filter(e=>isThisMonth(e.ts));
  const mIncome = monthEntries.filter(e=>e.type==='income').reduce((s,e)=>s+e.amount,0);
  const mExpense = monthEntries.filter(e=>e.type==='expense').reduce((s,e)=>s+e.amount,0);
  document.getElementById("mIncome").textContent = fmt(mIncome);
  document.getElementById("mExpense").textContent = fmt(mExpense);
  document.getElementById("mNet").textContent = fmt(mIncome-mExpense);

  const totalIncome = entries.filter(e=>e.type==='income').reduce((s,e)=>s+e.amount,0);
  const totalExpense = entries.filter(e=>e.type==='expense').reduce((s,e)=>s+e.amount,0);
  const net = totalIncome - totalExpense;

  document.getElementById("longGoalLabel").textContent = `🏰 ${settings.longLabel}`;
  const longPct = Math.max(0, Math.min(100, (net/settings.longGoal)*100));
  document.getElementById("goalBar").style.width = longPct+"%";
  document.getElementById("goalPct").textContent = `${fmt(net)} / ${fmt(settings.longGoal)} (${longPct.toFixed(longPct<1?4:2)}%)`;

  document.getElementById("shortGoalLabel").textContent = `🌱 ${settings.shortLabel}`;
  const shortPct = Math.max(0, Math.min(100, (net/settings.shortGoal)*100));
  document.getElementById("shortGoalBar").style.width = shortPct+"%";
  document.getElementById("shortGoalPct").textContent = `${fmt(net)} / ${fmt(settings.shortGoal)} (${shortPct.toFixed(1)}%)`;

  const budgetBar = document.getElementById("budgetBar");
  const budgetPctEl = document.getElementById("budgetPct");
  if(settings.monthlyBudget > 0){
    const bPct = Math.min(100, (mExpense/settings.monthlyBudget)*100);
    budgetBar.style.width = bPct+"%";
    budgetBar.className = "goal-bar-inner budget " + (mExpense <= settings.monthlyBudget ? "ok" : "over");
    const remain = settings.monthlyBudget - mExpense;
    budgetPctEl.textContent = remain >= 0
      ? `예산 내 ✓ (${fmt(remain)} 남음)`
      : `예산 초과 (${fmt(-remain)} 초과)`;
  }else{
    budgetBar.style.width = "0%";
    budgetPctEl.textContent = "예산 미설정 (⚙️에서 설정하세요)";
  }
}

function renderCatReport(){
  const monthExpenses = entries.filter(e=>e.type==='expense' && isThisMonth(e.ts));
  const box = document.getElementById("catReport");
  if(monthExpenses.length===0){
    box.innerHTML = '<div class="loading">이번 달 지출 기록이 없습니다</div>';
    return;
  }
  const sums = {};
  monthExpenses.forEach(e=>{ sums[e.category] = (sums[e.category]||0) + e.amount; });
  const max = Math.max(...Object.values(sums));
  const rows = CATEGORIES.filter(c=>sums[c.id]).sort((a,b)=>sums[b.id]-sums[a.id]);
  box.innerHTML = rows.map(c=>{
    const amt = sums[c.id];
    const w = max>0 ? (amt/max)*100 : 0;
    return `
      <div class="cat-row">
        <div class="cat-icon">${c.icon}</div>
        <div class="cat-name">${c.name}</div>
        <div class="cat-bar-outer"><div class="cat-bar-inner" style="width:${w}%"></div></div>
        <div class="cat-amt">${fmt(amt)}</div>
      </div>`;
  }).join("");
}

function renderLog(){
  const box = document.getElementById("syslog");
  if(entries.length===0){
    box.innerHTML = '<div class="entry">아직 기록이 없습니다. 첫 기록을 남겨보세요!</div>';
    return;
  }
  box.innerHTML = entries.slice(0,30).map(e=>{
    const info = PERSON_INFO[e.person] || {name:'???', icon:'❓'};
    const time = new Date(e.ts).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
    const catInfo = CATEGORIES.find(c=>c.id===e.category);
    const label = e.type==='income'
      ? `${info.icon} ${info.name}: 수입 +${fmt(e.amount)}${e.memo?` (${e.memo})`:''}`
      : `${info.icon} ${info.name}: ${catInfo?catInfo.icon+' '+catInfo.name:''} -${fmt(e.amount)}${e.memo?` (${e.memo})`:''}`;
    return `<div class="entry ${e.type}"><span class="tag">[${time}]</span> ${label}</div>`;
  }).join("");
}

function renderAll(){
  renderParty();
  renderTreasury();
  renderCatReport();
  renderLog();
}

// ---- Income quick entry ----
// ---- Unified entry modal (income / expense) ----
function renderCatGrid(){
  const grid = document.getElementById("catGrid");
  grid.innerHTML = CATEGORIES.map(c=>`
    <div class="cat-btn ${selectedCat===c.id?'selected':''}" data-id="${c.id}">
      <span class="ic">${c.icon}</span>${c.name}
    </div>`).join("");
  grid.querySelectorAll(".cat-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      selectedCat = btn.getAttribute("data-id");
      renderCatGrid();
    });
  });
}

function openEntryModal(mode){
  modalMode = mode;
  selectedCat = null;
  document.getElementById("modalTitle").textContent = mode==='income' ? "수입 기록" : "지출 기록";
  document.getElementById("modalDate").value = todayStr();
  document.getElementById("modalAmount").value = "";
  document.getElementById("modalMemo").value = "";
  document.getElementById("catGrid").style.display = mode==='income' ? "none" : "grid";
  renderCatGrid();
  document.getElementById("modalOverlay").classList.add("show");
}
document.getElementById("incomeBtn").addEventListener("click", ()=>openEntryModal("income"));
document.getElementById("expenseBtn").addEventListener("click", ()=>openEntryModal("expense"));

document.getElementById("modalCancel").addEventListener("click", ()=>{
  document.getElementById("modalOverlay").classList.remove("show");
});
document.getElementById("modalSubmit").addEventListener("click", async ()=>{
  const amount = parseInt(document.getElementById("modalAmount").value, 10);
  const memo = document.getElementById("modalMemo").value || "";
  const dateVal = document.getElementById("modalDate").value || todayStr();
  const ts = new Date(dateVal + "T12:00:00").getTime();
  if(!amount || amount<=0){ alert("금액을 입력해주세요."); return; }
  if(modalMode==='expense' && !selectedCat){ alert("카테고리를 선택해주세요."); return; }

  const entry = modalMode==='income'
    ? {type:"income", amount, memo, person: myPerson, ts}
    : {type:"expense", amount, category:selectedCat, memo, person: myPerson, ts};

  await pushEntry(entry);
  document.getElementById("modalOverlay").classList.remove("show");
  showToast(modalMode==='income' ? `💰 수입 +${fmt(amount)} 기록됨` : `📦 지출 -${fmt(amount)} 기록됨`);
  await loadEntries();
});

// ---- Settings modal ----
document.getElementById("settingsBtn").addEventListener("click", ()=>{
  document.getElementById("setLongLabel").value = settings.longLabel;
  document.getElementById("setLongGoal").value = settings.longGoal;
  document.getElementById("setShortLabel").value = settings.shortLabel;
  document.getElementById("setShortGoal").value = settings.shortGoal;
  document.getElementById("setBudget").value = settings.monthlyBudget || "";
  document.getElementById("settingsOverlay").classList.add("show");
});
document.getElementById("settingsCancel").addEventListener("click", ()=>{
  document.getElementById("settingsOverlay").classList.remove("show");
});
document.getElementById("settingsSubmit").addEventListener("click", async ()=>{
  const newSettings = {
    longLabel: document.getElementById("setLongLabel").value || "장기 목표",
    longGoal: parseInt(document.getElementById("setLongGoal").value,10) || 3000000000,
    shortLabel: document.getElementById("setShortLabel").value || "현실 목표",
    shortGoal: parseInt(document.getElementById("setShortGoal").value,10) || 10000000,
    monthlyBudget: parseInt(document.getElementById("setBudget").value,10) || 0
  };
  await saveSettings(newSettings);
  document.getElementById("settingsOverlay").classList.remove("show");
  showToast("⚙️ 목표가 저장됐어요");
  renderAll();
});

// ---- Person picker ----
function checkPerson(){
  if(myPerson && PERSON_INFO[myPerson]){
    document.getElementById("personOverlay").style.display = "none";
    return true;
  }
  document.getElementById("personOverlay").style.display = "flex";
  return false;
}
document.querySelectorAll(".person-opt").forEach(opt=>{
  opt.addEventListener("click", ()=>{
    myPerson = opt.getAttribute("data-person");
    localStorage.setItem("ledger_person", myPerson);
    document.getElementById("personOverlay").style.display = "none";
    renderAll();
  });
});
document.getElementById("switchBtn").addEventListener("click", ()=>{
  document.getElementById("personOverlay").style.display = "flex";
});

document.getElementById("refreshBtn").addEventListener("click", loadEntries);

(async function init(){
  checkPerson();
  await loadSettings();
  await loadEntries();
})();
</script>
