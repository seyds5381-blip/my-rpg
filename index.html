<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>어둠의 창업기</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="어둠의 창업기">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230B0906'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle'%3E%E2%9A%94%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0B0906;
    --wood:#2A2018;
    --wood-light:#3B2E22;
    --gold:#D4AF56;
    --gold-dim:#8A733A;
    --gold-bright:#F0D080;
    --parchment:#E8DCC0;
    --parchment-dim:#B3A585;
    --hp:#8B2E2E;
    --hp-bright:#C1443B;
    --mp:#2E5F8B;
    --mp-bright:#4A8FC1;
    --exp:#B3892E;
    --exp-bright:#E0B84D;
    --common:#B0A996;
    --rare:#5FA8D3;
    --epic:#B071D3;
    --legendary:#E0A83C;
    --unique:#D3505F;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top, #1a140d 0%, #0B0906 60%);
    color:var(--parchment);
    font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    min-height:100vh;
    padding:10px 8px 90px;
  }
  .wrap{max-width:480px;margin:0 auto;}

  /* ===== Frame utility ===== */
  .frame{
    background:linear-gradient(180deg, var(--wood-light), var(--wood));
    border:2px solid var(--gold-dim);
    border-radius:4px;
    position:relative;
    padding:12px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5), 0 3px 10px rgba(0,0,0,0.5);
  }
  .frame::before,.frame::after,
  .frame .corner-tl,.frame .corner-tr,.frame .corner-bl,.frame .corner-br{
    content:"";
    position:absolute;
    width:9px;height:9px;
    border:2px solid var(--gold);
  }
  .corner-tl{top:-2px;left:-2px;border-right:none;border-bottom:none;}
  .corner-tr{top:-2px;right:-2px;border-left:none;border-bottom:none;}
  .corner-bl{bottom:-2px;left:-2px;border-right:none;border-top:none;}
  .corner-br{bottom:-2px;right:-2px;border-left:none;border-top:none;}

  .frame-title{
    font-family:Georgia,"Noto Serif KR",serif;
    font-size:12px;
    letter-spacing:2px;
    color:var(--gold-bright);
    text-align:center;
    margin:-12px -12px 10px;
    padding:6px;
    background:linear-gradient(180deg, rgba(0,0,0,0.35), transparent);
    border-bottom:1px solid var(--gold-dim);
  }

  /* ===== Top title banner ===== */
  .game-title{
    text-align:center;
    margin-bottom:10px;
    padding:8px 0 4px;
  }
  .game-title .sub{font-size:10px;letter-spacing:3px;color:var(--gold-dim);}
  .game-title h1{
    font-family:Georgia,"Noto Serif KR",serif;
    font-size:20px;
    color:var(--gold-bright);
    margin:2px 0 0;
    text-shadow:0 0 12px rgba(212,175,86,0.4);
    letter-spacing:1px;
  }

  /* ===== HUD ===== */
  .hud{margin-bottom:10px;}
  .hud-inner{display:flex;gap:12px;align-items:center;}
  .portrait{
    width:56px;height:56px;
    border:2px solid var(--gold);
    border-radius:4px;
    background:radial-gradient(circle at 35% 30%, #4a3a24, #16110b);
    display:flex;align-items:center;justify-content:center;
    font-size:26px;
    flex-shrink:0;
  }
  .hud-bars{flex:1;}
  .hud-name-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;}
  .hud-name{font-size:15px;font-weight:700;color:var(--parchment);}
  .hud-class{font-size:10.5px;color:var(--mp-bright);}
  .hud-lv{font-family:'SF Mono','Consolas',monospace;color:var(--gold-bright);font-size:13px;font-weight:700;}

  .bar-row{display:flex;align-items:center;gap:6px;margin-top:3px;}
  .bar-tag{
    font-family:'SF Mono','Consolas',monospace;
    font-size:9px;
    width:22px;
    color:var(--parchment-dim);
    flex-shrink:0;
  }
  .bar-outer{
    flex:1;height:11px;
    background:#0E0C0A;
    border:1px solid rgba(0,0,0,0.6);
    border-radius:2px;
    overflow:hidden;
    position:relative;
  }
  .bar-inner{height:100%;transition:width .4s ease;}
  .bar-inner.hp{background:linear-gradient(180deg, var(--hp-bright), var(--hp));}
  .bar-inner.mp{background:linear-gradient(180deg, var(--mp-bright), var(--mp));}
  .bar-inner.exp{background:linear-gradient(180deg, var(--exp-bright), var(--exp));}
  .bar-num{font-family:'SF Mono','Consolas',monospace;font-size:8.5px;color:var(--parchment-dim);width:56px;text-align:right;flex-shrink:0;}

  /* ===== Tabs ===== */
  .tabs{
    display:flex;
    gap:3px;
    margin-bottom:8px;
  }
  .tab-btn{
    flex:1;
    background:linear-gradient(180deg, var(--wood-light), var(--wood));
    border:1px solid var(--gold-dim);
    border-radius:3px 3px 0 0;
    color:var(--parchment-dim);
    font-size:11px;
    padding:8px 2px;
    text-align:center;
    cursor:pointer;
    font-family:Georgia,"Noto Serif KR",serif;
    letter-spacing:0.5px;
  }
  .tab-btn.active{
    background:linear-gradient(180deg, #4A3A24, #2A2018);
    color:var(--gold-bright);
    border-color:var(--gold);
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
  }

  .panel-body{min-height:120px;}
  .hidden{display:none !important;}

  /* ===== Status tab ===== */
  .stat-line{
    display:flex;justify-content:space-between;
    padding:7px 2px;
    border-bottom:1px solid rgba(212,175,86,0.15);
    font-size:12.5px;
  }
  .stat-line:last-child{border-bottom:none;}
  .stat-line .v{font-family:'SF Mono','Consolas',monospace;color:var(--gold-bright);}
  .title-badge{
    display:inline-block;
    margin-top:8px;
    padding:5px 10px;
    background:rgba(212,175,86,0.1);
    border:1px solid var(--gold-dim);
    border-radius:3px;
    font-size:11px;
    color:var(--gold-bright);
  }

  /* ===== Quest tab ===== */
  .qtab-switch{display:flex;gap:6px;margin-bottom:8px;}
  .qtab-switch button{
    background:transparent;border:1px solid var(--gold-dim);color:var(--parchment-dim);
    font-size:10.5px;padding:5px 10px;border-radius:12px;cursor:pointer;
  }
  .qtab-switch button.on{background:var(--gold-dim);color:#1a140d;font-weight:700;}
  .quest-item{
    display:flex;align-items:flex-start;gap:8px;
    padding:8px 4px;
    border-bottom:1px dotted rgba(212,175,86,0.2);
  }
  .quest-item:last-child{border-bottom:none;}
  .qcheck{
    appearance:none;width:17px;height:17px;
    border:1px solid var(--gold-dim);border-radius:2px;
    background:#0E0C0A;flex-shrink:0;margin-top:1px;cursor:pointer;position:relative;
  }
  .qcheck:checked{background:var(--gold);border-color:var(--gold);}
  .qcheck:checked::after{content:"✓";position:absolute;left:2px;top:-1px;font-size:11px;color:#1a140d;font-weight:700;}
  .q-text{flex:1;font-size:12.5px;line-height:1.4;}
  .quest-item.done .q-text{color:var(--parchment-dim);text-decoration:line-through;}
  .q-xp{font-family:'SF Mono','Consolas',monospace;font-size:10.5px;color:var(--exp-bright);white-space:nowrap;}

  /* ===== Inventory tab ===== */
  .inv-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:6px;
  }
  .inv-slot{
    aspect-ratio:1;
    background:#0E0C0A;
    border:1px solid var(--gold-dim);
    border-radius:3px;
    display:flex;align-items:center;justify-content:center;
    font-size:22px;
    position:relative;
    cursor:pointer;
  }
  .inv-slot.common{border-color:var(--common);}
  .inv-slot.rare{border-color:var(--rare); box-shadow:0 0 6px rgba(95,168,211,0.4);}
  .inv-slot.epic{border-color:var(--epic); box-shadow:0 0 6px rgba(176,113,211,0.4);}
  .inv-slot.legendary{border-color:var(--legendary); box-shadow:0 0 8px rgba(224,168,60,0.55);}
  .inv-slot .stack{
    position:absolute;bottom:1px;right:3px;
    font-family:'SF Mono','Consolas',monospace;
    font-size:9px;color:var(--parchment);
    text-shadow:0 0 3px #000;
  }
  .inv-detail{
    margin-top:10px;
    padding:10px;
    background:rgba(0,0,0,0.3);
    border:1px solid var(--gold-dim);
    border-radius:3px;
    min-height:64px;
  }
  .inv-detail .name{font-size:12.5px;font-weight:700;margin-bottom:4px;}
  .inv-detail .name.common{color:var(--common);}
  .inv-detail .name.rare{color:var(--rare);}
  .inv-detail .name.epic{color:var(--epic);}
  .inv-detail .name.legendary{color:var(--legendary);}
  .inv-detail .desc{font-size:11px;color:var(--parchment-dim);line-height:1.5;}
  .inv-hint{font-size:11px;color:var(--parchment-dim);text-align:center;padding-top:14px;}

  /* ===== Skill tab ===== */
  .skill-track{margin-bottom:14px;}
  .skill-track:last-child{margin-bottom:0;}
  .skill-track-title{
    font-size:11px;color:var(--mp-bright);letter-spacing:1px;margin-bottom:8px;
    font-family:Georgia,"Noto Serif KR",serif;
  }
  .skill-node{
    display:flex;align-items:center;gap:10px;
    padding:7px 6px;
    border-radius:3px;
    margin-bottom:4px;
  }
  .skill-node.unlocked{background:rgba(212,175,86,0.08);}
  .skill-node.locked{opacity:0.4;}
  .skill-icon{
    width:30px;height:30px;border-radius:4px;
    border:1px solid var(--gold-dim);
    display:flex;align-items:center;justify-content:center;
    font-size:15px;flex-shrink:0;
    background:#0E0C0A;
  }
  .skill-node.unlocked .skill-icon{border-color:var(--gold);}
  .skill-info{flex:1;}
  .skill-name{font-size:12px;font-weight:600;}
  .skill-req{font-family:'SF Mono','Consolas',monospace;font-size:9.5px;color:var(--parchment-dim);}

  /* ===== Boss tab ===== */
  .boss-card{
    border:1px solid var(--hp);
    background:rgba(139,46,46,0.08);
    border-radius:4px;
    padding:11px;
    margin-bottom:9px;
  }
  .boss-card.done{border-color:#4a7a4d;background:rgba(74,122,77,0.08);}
  .boss-card:last-child{margin-bottom:0;}
  .boss-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
  .boss-period{font-family:'SF Mono','Consolas',monospace;font-size:9.5px;color:var(--hp-bright);}
  .boss-card.done .boss-period{color:#6FBF73;}
  .boss-name{font-size:13.5px;font-weight:700;margin-bottom:4px;}
  .boss-desc{font-size:11px;color:var(--parchment-dim);line-height:1.5;margin-bottom:7px;}
  .boss-btn{
    width:100%;
    background:linear-gradient(180deg, var(--hp-bright), var(--hp));
    border:1px solid #4a1a1a;
    color:#fff;font-size:11.5px;font-weight:700;
    padding:7px;border-radius:3px;cursor:pointer;
    font-family:Georgia,"Noto Serif KR",serif;
    letter-spacing:1px;
  }
  .boss-card.done .boss-btn{
    background:linear-gradient(180deg, #6FBF73, #3d7a40);
    border-color:#2a4a2c;
  }

  /* ===== System log ===== */
  .syslog{
    margin-top:10px;
    background:rgba(0,0,0,0.45);
    border:1px solid var(--gold-dim);
    border-radius:4px;
    padding:8px 10px;
    max-height:130px;
    overflow-y:auto;
    font-family:'SF Mono','Consolas',monospace;
    font-size:10.5px;
    line-height:1.8;
  }
  .syslog .entry{color:var(--parchment-dim);}
  .syslog .entry .tag{color:var(--gold-bright);}
  .syslog .entry.boss .tag{color:var(--hp-bright);}
  .syslog .entry.levelup .tag{color:var(--mp-bright);}

  .reset-btn{
    display:block;margin:16px auto 0;
    background:transparent;border:1px solid var(--parchment-dim);
    color:var(--parchment-dim);font-size:10.5px;
    padding:7px 14px;border-radius:3px;cursor:pointer;
  }

  /* ===== Level up overlay ===== */
  #levelupOverlay{
    position:fixed;inset:0;
    display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,0.55);
    z-index:999;
    opacity:0;pointer-events:none;
    transition:opacity .35s ease;
  }
  #levelupOverlay.show{opacity:1;pointer-events:auto;}
  .levelup-box{
    text-align:center;
    animation:pop .5s ease;
  }
  .levelup-box .lu1{font-family:Georgia,"Noto Serif KR",serif;font-size:14px;color:var(--gold-dim);letter-spacing:4px;}
  .levelup-box .lu2{
    font-family:Georgia,"Noto Serif KR",serif;
    font-size:40px;color:var(--gold-bright);
    text-shadow:0 0 20px rgba(212,175,86,0.7);
    margin:4px 0;
  }
  .levelup-box .lu3{font-size:13px;color:var(--parchment);}
  @keyframes pop{
    0%{transform:scale(0.7);opacity:0;}
    60%{transform:scale(1.08);opacity:1;}
    100%{transform:scale(1);}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="game-title">
    <div class="sub">D A R K &nbsp; S T A R T U P &nbsp; O N L I N E</div>
    <h1>어둠의 창업기</h1>
  </div>

  <!-- HUD -->
  <div class="frame hud">
    <div class="corner-tl"></div><div class="corner-tr"></div><div class="corner-bl"></div><div class="corner-br"></div>
    <div class="hud-inner">
      <div class="portrait">🧑‍✈️</div>
      <div class="hud-bars">
        <div class="hud-name-row">
          <div>
            <div class="hud-name">유대승</div>
            <div class="hud-class" id="hudClass">신입 모험가</div>
          </div>
          <div class="hud-lv">Lv.<span id="hudLv">1</span></div>
        </div>
        <div class="bar-row">
          <div class="bar-tag">HP</div>
          <div class="bar-outer"><div class="bar-inner hp" id="hpBar" style="width:100%"></div></div>
          <div class="bar-num" id="hpNum">100/100</div>
        </div>
        <div class="bar-row">
          <div class="bar-tag">MP</div>
          <div class="bar-outer"><div class="bar-inner mp" id="mpBar" style="width:100%"></div></div>
          <div class="bar-num" id="mpNum">100/100</div>
        </div>
        <div class="bar-row">
          <div class="bar-tag">EXP</div>
          <div class="bar-outer"><div class="bar-inner exp" id="expBar" style="width:0%"></div></div>
          <div class="bar-num" id="expNum">0/100</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="status">상태창</button>
    <button class="tab-btn" data-tab="quest">퀘스트북</button>
    <button class="tab-btn" data-tab="inventory">인벤토리</button>
    <button class="tab-btn" data-tab="skill">스킬창</button>
    <button class="tab-btn" data-tab="boss">보스전</button>
  </div>

  <div class="frame">
    <div class="corner-tl"></div><div class="corner-tr"></div><div class="corner-bl"></div><div class="corner-br"></div>
    <div class="frame-title" id="panelTitle">상 태 창</div>

    <div class="panel-body" id="statusPanel">
      <div class="stat-line"><span>이름</span><span class="v">유대승</span></div>
      <div class="stat-line"><span>전직</span><span class="v">승무원(12년) → 크리에이터 창업가</span></div>
      <div class="stat-line"><span>재무력</span><span class="v" id="s-fin">0</span></div>
      <div class="stat-line"><span>콘텐츠력</span><span class="v" id="s-con">0</span></div>
      <div class="stat-line"><span>브랜드력</span><span class="v" id="s-brd">0</span></div>
      <div class="stat-line"><span>실행력</span><span class="v" id="s-exe">0</span></div>
      <div class="stat-line"><span>누적 클리어 퀘스트</span><span class="v" id="s-qcount">0</span></div>
      <div class="stat-line"><span>격파한 보스</span><span class="v" id="s-bcount">0 / 5</span></div>
      <div class="title-badge" id="titleBadge">칭호: 신입 모험가</div>
    </div>

    <div class="panel-body hidden" id="questPanel">
      <div class="qtab-switch">
        <button class="on" data-qtab="daily">일일</button>
        <button data-qtab="weekly">주간</button>
      </div>
      <div id="dailyBox"></div>
      <div id="weeklyBox" class="hidden"></div>
    </div>

    <div class="panel-body hidden" id="inventoryPanel">
      <div class="inv-grid" id="invGrid"></div>
      <div class="inv-detail" id="invDetail">
        <div class="inv-hint">아이템을 눌러 상세 설명을 확인하세요</div>
      </div>
    </div>

    <div class="panel-body hidden" id="skillPanel">
      <div class="skill-track">
        <div class="skill-track-title">TRACK A — 커머스 계열</div>
        <div id="skillA"></div>
      </div>
      <div class="skill-track">
        <div class="skill-track-title">TRACK B — 개인 브랜드 계열</div>
        <div id="skillB"></div>
      </div>
    </div>

    <div class="panel-body hidden" id="bossPanel">
      <div id="bossBox"></div>
    </div>
  </div>

  <!-- System log -->
  <div class="syslog" id="syslog"></div>

  <button class="reset-btn" id="resetBtn">모험 기록 초기화</button>

</div>

<div id="levelupOverlay">
  <div class="levelup-box">
    <div class="lu1">L E V E L &nbsp; U P</div>
    <div class="lu2" id="luLevel">2</div>
    <div class="lu3" id="luClass">야매 크리에이터</div>
  </div>
</div>

<script>
const STORAGE_KEY = "dark_startup_online_v1";

const DAILY = [
  {id:"d1", t:"트렌드 리서치 30분 (인스타·유튜브·틱톡)", xp:10},
  {id:"d2", t:"육아 계정 콘텐츠 작업 (촬영/편집/브랜드 컨택)", xp:20},
  {id:"d3", t:"확정된 프리랜서·컨설팅 작업 처리", xp:15},
  {id:"d4", t:"개인 브랜드 콘텐츠 제작 또는 스레드 포스팅", xp:15},
  {id:"d5", t:"내일 일정 정리 & DM/컨택 회신", xp:5},
];
const WEEKLY = [
  {id:"w1", t:"Track A 콘텐츠 3~4개 업로드", xp:60},
  {id:"w2", t:"브랜드 컨택 5곳 이상 발송", xp:50},
  {id:"w3", t:"Track B 릴스 1~2개 업로드", xp:40},
  {id:"w4", t:"스레드 주 5회 이상 포스팅", xp:30},
];
const BOSSES = [
  {id:"b1", period:"1개월차", t:"생존의 던전", d:"알바/프리랜서 확정 · 육아 계정 복귀 콘텐츠 업로드 · 브랜드 리스트업 및 컨택 시작", xp:200},
  {id:"b2", period:"2개월차", t:"첫 보스전 — 공구 재오픈", d:"응답 온 브랜드부터 공구 세팅, 매출 재현 시도", xp:300},
  {id:"b3", period:"3~4개월차", t:"매출 안정화", d:"Track A 매출 안정 궤도 진입, 당근 무료특강 테스트", xp:400},
  {id:"b4", period:"5~6개월차", t:"확장기", d:"생계 갭 완전 해소, 전자책(1단계) 출시", xp:500},
  {id:"b5", period:"2년차", t:"전직 퀘스트 — 자체 브랜드 런칭", d:"공구에서 자체 소싱·자체 브랜드 상품으로 전환, 팀 위임 시작", xp:1000},
];
const INVENTORY = [
  {id:"i1", icon:"📱", name:"프리미어프로 비급서", grade:"rare", stack:1, desc:"[숙련도 +3] 컷편집·자막·색보정을 자유자재로 다룰 수 있게 하는 마스터리 스킬북."},
  {id:"i2", icon:"🎬", name:"릴스 마스터리 각인", grade:"epic", stack:1, desc:"3년간 숏폼 200개 제작으로 얻은 각인. 후킹력 +영구 증가."},
  {id:"i3", icon:"🤝", name:"브랜드 협업 인장", grade:"rare", stack:30, desc:"30곳 이상의 브랜드와 협업하며 얻은 신뢰의 증표. 협상력 상승."},
  {id:"i4", icon:"💰", name:"공동구매 승리의 증표", grade:"epic", stack:1, desc:"누적 매출 1억원 이상 달성. 전환력 스탯의 근원."},
  {id:"i5", icon:"🎖️", name:"승무원 12년 근속패", grade:"legendary", stack:1, desc:"12년간 축적된 위기대응력·팀워크·신뢰 커뮤니케이션. 모든 스탯의 베이스가 되는 전설급 유물."},
  {id:"i6", icon:"📜", name:"육아계정 부활의 주문서", grade:"epic", stack:1, desc:"3개월 만에 1만 팔로워를 만든 계정. 사용 시 즉시 재가동 가능 (현재 대기 중)."},
  {id:"i7", icon:"⚔️", name:"화물모아 지원서", grade:"rare", stack:1, desc:"신규 던전 입장권. 제출 시 다음 스테이지로 이동."},
  {id:"i8", icon:"👨‍👩‍👧", name:"가족의 축복", grade:"legendary", stack:1, desc:"아내와 16개월 아기. 모든 퀘스트 수행의 진짜 이유. 사기 저하 면역."},
];
const SKILLS_A = [
  {id:"sa1", icon:"💡", name:"콘텐츠 기획", req:1},
  {id:"sa2", icon:"📞", name:"브랜드 컨택", req:3},
  {id:"sa3", icon:"🛒", name:"공구 세팅", req:5},
  {id:"sa4", icon:"💹", name:"매출 전환", req:8},
  {id:"sa5", icon:"🏭", name:"자체 브랜드화", req:15},
];
const SKILLS_B = [
  {id:"sb1", icon:"🔍", name:"트렌드 리서치", req:1},
  {id:"sb2", icon:"🎞️", name:"릴스 제작", req:3},
  {id:"sb3", icon:"💬", name:"스레드 운영", req:6},
  {id:"sb4", icon:"📘", name:"전자책 제작", req:10},
  {id:"sb5", icon:"🎓", name:"그룹 코칭", req:15},
];

let state = { xp:0, checked:{}, log:[] };

function levelForXp(xp){ return Math.max(1, Math.floor(Math.sqrt(xp/45)) + 1); }
function xpForLevel(lv){ return Math.pow(lv-1,2)*45; }
function classTitle(lv){
  if(lv<5) return "신입 모험가";
  if(lv<10) return "야매 크리에이터";
  if(lv<15) return "커머스 전사";
  if(lv<20) return "브랜드 마스터";
  if(lv<30) return "1인 사업가";
  return "레전드 창업가";
}

async function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state = { xp: parsed.xp||0, checked: parsed.checked||{}, log: parsed.log||[] };
    }
  }catch(e){ console.error("불러오기 실패", e); }
}
async function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.error("저장 실패", e); }
}

function addLog(text, cls){
  const time = new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
  state.log.unshift({text, cls: cls||'', time});
  state.log = state.log.slice(0, 30);
}

function renderLog(){
  const box = document.getElementById("syslog");
  if(state.log.length===0){
    box.innerHTML = '<div class="entry">퀘스트를 완료하면 여기에 기록이 쌓입니다.</div>';
    return;
  }
  box.innerHTML = state.log.map(e => `<div class="entry ${e.cls}"><span class="tag">[${e.time}]</span> ${e.text}</div>`).join("");
}

function renderHUD(){
  const lv = levelForXp(state.xp);
  const curFloor = xpForLevel(lv);
  const nextFloor = xpForLevel(lv+1);
  const need = nextFloor - curFloor;
  const cur = state.xp - curFloor;
  const pct = Math.min(100, (cur/need)*100);

  document.getElementById("hudLv").textContent = lv;
  document.getElementById("hudClass").textContent = classTitle(lv);
  document.getElementById("expBar").style.width = pct+"%";
  document.getElementById("expNum").textContent = `${cur}/${need}`;

  // HP/MP flavor: fixed full for now (represents 컨디션 관리 — 항상 풀충전 유지가 목표)
  document.getElementById("hpBar").style.width = "100%";
  document.getElementById("hpNum").textContent = "100/100";
  document.getElementById("mpBar").style.width = "100%";
  document.getElementById("mpNum").textContent = "100/100";

  document.getElementById("s-fin").textContent = Math.min(100, Math.round(lv*3));
  document.getElementById("s-con").textContent = Math.min(100, Math.round(lv*4));
  document.getElementById("s-brd").textContent = Math.min(100, Math.round(lv*2.5));
  document.getElementById("s-exe").textContent = Math.min(100, Math.round(lv*3.5));
  document.getElementById("s-qcount").textContent = Object.values(state.checked).filter(Boolean).length;
  const bossCleared = BOSSES.filter(b => state.checked[b.id]).length;
  document.getElementById("s-bcount").textContent = `${bossCleared} / ${BOSSES.length}`;
  document.getElementById("titleBadge").textContent = `칭호: ${classTitle(lv)}`;
}

function renderQuests(list, containerId){
  const box = document.getElementById(containerId);
  box.innerHTML = list.map(q=>{
    const done = !!state.checked[q.id];
    return `
      <label class="quest-item ${done?'done':''}">
        <input type="checkbox" class="qcheck" ${done?'checked':''} data-id="${q.id}" data-xp="${q.xp}" data-name="${q.t}">
        <div class="q-text">${q.t}</div>
        <div class="q-xp">+${q.xp}</div>
      </label>`;
  }).join("");
  box.querySelectorAll(".qcheck").forEach(cb=>cb.addEventListener("change", onQuestToggle));
}

function renderBosses(){
  const box = document.getElementById("bossBox");
  box.innerHTML = BOSSES.map(b=>{
    const done = !!state.checked[b.id];
    return `
      <div class="boss-card ${done?'done':''}">
        <div class="boss-top">
          <span class="boss-period">${b.period}</span>
        </div>
        <div class="boss-name">${b.t}</div>
        <div class="boss-desc">${b.d}</div>
        <button class="boss-btn" data-id="${b.id}" data-xp="${b.xp}" data-name="${b.t}" ${done?'disabled':''}>
          ${done ? '토벌 완료' : `도전하기 (+${b.xp} XP)`}
        </button>
      </div>`;
  }).join("");
  box.querySelectorAll(".boss-btn").forEach(btn=>{
    if(!btn.disabled) btn.addEventListener("click", onBossClear);
  });
}

function renderInventory(){
  const grid = document.getElementById("invGrid");
  grid.innerHTML = INVENTORY.map(it=>`
    <div class="inv-slot ${it.grade}" data-id="${it.id}">
      ${it.icon}
      ${it.stack>1?`<span class="stack">x${it.stack}</span>`:''}
    </div>
  `).join("");
  grid.querySelectorAll(".inv-slot").forEach(slot=>{
    slot.addEventListener("click", ()=>{
      const it = INVENTORY.find(x=>x.id===slot.getAttribute("data-id"));
      document.getElementById("invDetail").innerHTML = `
        <div class="name ${it.grade}">${it.icon} ${it.name}</div>
        <div class="desc">${it.desc}</div>`;
    });
  });
}

function renderSkills(){
  const lv = levelForXp(state.xp);
  function block(list){
    return list.map(s=>{
      const unlocked = lv >= s.req;
      return `
        <div class="skill-node ${unlocked?'unlocked':'locked'}">
          <div class="skill-icon">${s.icon}</div>
          <div class="skill-info">
            <div class="skill-name">${s.name}</div>
            <div class="skill-req">${unlocked ? '습득 완료' : `Lv.${s.req} 필요`}</div>
          </div>
        </div>`;
    }).join("");
  }
  document.getElementById("skillA").innerHTML = block(SKILLS_A);
  document.getElementById("skillB").innerHTML = block(SKILLS_B);
}

function renderAll(){
  renderHUD();
  renderQuests(DAILY, "dailyBox");
  renderQuests(WEEKLY, "weeklyBox");
  renderBosses();
  renderInventory();
  renderSkills();
  renderLog();
}

async function onQuestToggle(e){
  const id = e.target.getAttribute("data-id");
  const xp = parseInt(e.target.getAttribute("data-xp"),10);
  const name = e.target.getAttribute("data-name");
  const nowChecked = e.target.checked;
  const beforeLv = levelForXp(state.xp);

  state.checked[id] = nowChecked;
  state.xp = Math.max(0, state.xp + (nowChecked? xp : -xp));

  if(nowChecked) addLog(`퀘스트 완료: <b>${name}</b> (+${xp} EXP)`, '');

  const afterLv = levelForXp(state.xp);
  renderAll();
  if(afterLv > beforeLv) triggerLevelUp(afterLv);
  await saveState();
}

async function onBossClear(e){
  const id = e.target.getAttribute("data-id");
  const xp = parseInt(e.target.getAttribute("data-xp"),10);
  const name = e.target.getAttribute("data-name");
  const beforeLv = levelForXp(state.xp);

  state.checked[id] = true;
  state.xp += xp;
  addLog(`보스 토벌 성공: <b>${name}</b> (+${xp} EXP)`, 'boss');

  const afterLv = levelForXp(state.xp);
  renderAll();
  if(afterLv > beforeLv) triggerLevelUp(afterLv);
  await saveState();
}

function triggerLevelUp(lv){
  addLog(`레벨 업! Lv.${lv} 달성 — 칭호 [${classTitle(lv)}] 획득`, 'levelup');
  renderLog();
  const overlay = document.getElementById("levelupOverlay");
  document.getElementById("luLevel").textContent = lv;
  document.getElementById("luClass").textContent = classTitle(lv);
  overlay.classList.add("show");
  setTimeout(()=>overlay.classList.remove("show"), 1600);
}

// Tab switching
const TAB_TITLES = {status:"상 태 창", quest:"퀘 스 트 북", inventory:"인 벤 토 리", skill:"스 킬 창", boss:"보 스 전"};
document.querySelectorAll(".tab-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    const tab = btn.getAttribute("data-tab");
    document.getElementById("panelTitle").textContent = TAB_TITLES[tab];
    ["status","quest","inventory","skill","boss"].forEach(t=>{
      document.getElementById(t+"Panel").classList.toggle("hidden", t!==tab);
    });
  });
});

// Quest sub-tab (daily/weekly)
document.querySelectorAll(".qtab-switch button").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".qtab-switch button").forEach(b=>b.classList.remove("on"));
    btn.classList.add("on");
    const qt = btn.getAttribute("data-qtab");
    document.getElementById("dailyBox").classList.toggle("hidden", qt!=="daily");
    document.getElementById("weeklyBox").classList.toggle("hidden", qt!=="weekly");
  });
});

document.getElementById("resetBtn").addEventListener("click", async ()=>{
  if(confirm("정말 모든 모험 기록을 초기화할까요? (레벨, 아이템 진행상황, 로그 모두 삭제)")){
    state = {xp:0, checked:{}, log:[]};
    renderAll();
    await saveState();
  }
});

(async function init(){
  await loadState();
  renderAll();
})();
</script>
